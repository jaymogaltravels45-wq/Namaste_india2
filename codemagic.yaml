workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 60
    environment:
      flutter: 3.22.2
      java: 17
      groups:
        - namaste_india_secrets  # Group in Codemagic: SUPABASE_URL, SUPABASE_ANON_KEY
    scripts:
      - name: Get packages
        script: |
          cd flutter_app
          flutter pub get
      - name: Build APK
        script: |
          cd flutter_app
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - neelkiru123@gmail.com
        notify:
          success: true
          failure: true
