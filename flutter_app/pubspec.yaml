name: namaste_india
description: Namaste India Cab Booking App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase - preserved
  supabase_flutter: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # Network
  http: ^1.2.1

  # Storage
  shared_preferences: ^2.2.2

  # UI
  pinput: ^3.0.1
  google_fonts: ^6.1.0

  # State management
  provider: ^6.1.1

  # Media
  image_picker: ^1.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
