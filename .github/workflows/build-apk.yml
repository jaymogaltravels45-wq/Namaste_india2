name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=https://sqswrtewedftceusycjf.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_mNhNIm6UYKrYaGewxgprlA_552H2hR-

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NamasteIndia-v1.0.0
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
